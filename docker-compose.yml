# ==============================================================================
# Unified CCTV Intelligence Platform — Docker Compose
# Gujarat Police Innovation Challenge 2026
#
# PoC Infrastructure Stack:
# - PostgreSQL 16 + PostGIS 3.4 (Relational + Spatial Geospatial Database)
# - Redis 7 Alpine (In-memory Cache & High-throughput Event Stream)
# - MinIO (S3-Compatible Immutable Evidence Object Storage)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 with PostGIS Extension
  # ----------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: gujcamera_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gujcamera_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gujcamera_dev_secret}
      POSTGRES_DB: ${POSTGRES_DB:-gujcamera_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gujcamera_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gujcamera_admin} -d ${POSTGRES_DB:-gujcamera_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (In-Memory Cache & Redis Streams Event Broker)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: gujcamera_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - gujcamera_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. MinIO S3 Object Storage (Frame Evidence & Snapshot Vault)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: gujcamera_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_secret_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - gujcamera_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4. MediaMTX RTSP Streaming Gateway (Video Middleware)
  # ----------------------------------------------------------------------------
  video-gateway:
    image: bluenviron/mediamtx:1.9.3
    container_name: gujcamera_video_gateway
    restart: unless-stopped
    ports:
      - "${RTSP_PORT:-${RTSP_SIMULATOR_PORT:-8554}}:8554"
      - "${HLS_PORT:-8888}:8888"
    volumes:
      - ./video-gateway/mediamtx.yml:/mediamtx.yml:ro
    networks:
      gujcamera_network:
        aliases:
          - video-gateway
          - simulator

  # ----------------------------------------------------------------------------
  # 5. FFmpeg CCTV Stream Loop Simulator (Deterministic Test Feeds)
  # ----------------------------------------------------------------------------
  stream-simulator:
    image: linuxserver/ffmpeg:latest
    container_name: gujcamera_stream_simulator
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/scripts/stream-loop.sh"]
    environment:
      GATEWAY_HOST: video-gateway
      GATEWAY_PORT: 8554
      RETRY_INTERVAL: 3
      FIXTURES_DIR: /fixtures
    volumes:
      - ./video-gateway/fixtures:/fixtures:ro
      - ./video-gateway/stream-loop.sh:/scripts/stream-loop.sh:ro
    networks:
      - gujcamera_network
    depends_on:
      - video-gateway

  # ----------------------------------------------------------------------------
  # 6. AI Vision Worker (Phase 3B: Frame Ingestion & Stream Consumer)
  # ----------------------------------------------------------------------------
  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: gujcamera_ai_worker
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${AI_WORKER_LOG_LEVEL:-INFO}
      WORKER_NAME: ${AI_WORKER_NAME:-gujcamera-ai-worker-01}
      SAMPLE_FPS: ${AI_WORKER_SAMPLE_FPS:-3.0}
      BASE_RECONNECT_DELAY: ${AI_WORKER_BASE_RECONNECT_DELAY:-2.0}
      MAX_RECONNECT_DELAY: ${AI_WORKER_MAX_RECONNECT_DELAY:-30.0}
      DECODE_FAILURE_THRESHOLD: ${AI_WORKER_DECODE_FAILURE_THRESHOLD:-5}
      METRICS_INTERVAL: ${AI_WORKER_METRICS_INTERVAL:-10.0}
      CAMERA_STREAMS: "CAM-AHM-01=rtsp://video-gateway:8554/cam-ahm-01,CAM-AHM-02=rtsp://video-gateway:8554/cam-ahm-02"
      VEHICLE_MODEL_PATH: ${VEHICLE_MODEL_PATH:-/app/models/yolov8n.pt}
      PLATE_MODEL_PATH: ${PLATE_MODEL_PATH:-}
      VEHICLE_CONFIDENCE_THRESHOLD: ${VEHICLE_CONFIDENCE_THRESHOLD:-0.40}
      PLATE_CONFIDENCE_THRESHOLD: ${PLATE_CONFIDENCE_THRESHOLD:-0.35}
      REDIS_HOST: ${AI_WORKER_REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_STREAM_VEHICLE_SIGHTINGS: ${REDIS_STREAM_VEHICLE_SIGHTINGS:-gujcamera:events:vehicle-sightings}
    volumes:
      - ./ai-worker/models:/app/models:ro
      - ./video-gateway/fixtures:/fixtures:ro
    networks:
      - gujcamera_network
    depends_on:
      - video-gateway
      - redis

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: gujcamera_postgres_data
  redis_data:
    name: gujcamera_redis_data
  minio_data:
    name: gujcamera_minio_data

# ------------------------------------------------------------------------------
# Isolated Internal Network
# ------------------------------------------------------------------------------
networks:
  gujcamera_network:
    name: gujcamera_network
    driver: bridge
