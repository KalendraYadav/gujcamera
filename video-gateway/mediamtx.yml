# ==============================================================================
# MediaMTX Configuration — Gujarat Police Innovation Challenge 2026
# Role: Real-time Video Streaming Gateway (RTSP / HLS)
# ==============================================================================

logLevel: info
logDestinations: [stdout]

# Network Listeners
rtsp: yes
rtspAddress: :8554
protocols: [tcp, udp]
encryption: "no"

# HLS streaming for browser live monitoring
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes

# Protocols and Control API
rtmp: no
srt: no
webrtc: no
api: yes
apiAddress: :9997
metrics: no

# Authentication Configuration (Restricts control plane API port 9997)
authMethod: internal
authInternalUsers:
  # Allow streaming and viewing of RTSP/HLS streams without authentication
  - user: any
    permissions:
      - action: read
      - action: publish
  # Secure control plane API (port 9997) restricted to authorized backend components
  - user: mediamtx_admin
    pass: mediamtx_dev_secret_2026
    permissions:
      - action: api

